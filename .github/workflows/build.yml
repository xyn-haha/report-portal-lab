name: build-and-smoke-test

# 什么时候自动跑：
#   - 推送到 main
#   - 有人给 main 提 Pull Request
#   - 手动点按钮触发（workflow_dispatch）
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ---------------------------------------------------------------
      # 1) 拿一份干净的代码（等价于 git clone）
      # ---------------------------------------------------------------
      - name: 检出代码
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 2) 行尾检查 —— 防的就是"Windows 上好好的，容器里起不来"这个坑
      #    shell 脚本如果是 CRLF 行尾，Linux 里会报 ": not found"
      # ---------------------------------------------------------------
      - name: 检查关键文件行尾（必须是 LF）
        run: |
          set -e
          fail=0
          for f in entrypoint.sh Dockerfile app.py init_db.py; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::文件缺失"
              fail=1
              continue
            fi
            if grep -q $'\r' "$f"; then
              echo "::error file=$f::$f 含 CRLF 行尾，容器里会启动失败"
              fail=1
            else
              echo "OK   $f  纯 LF"
            fi
          done
          exit $fail

      # ---------------------------------------------------------------
      # 3) 从零构建镜像
      # ---------------------------------------------------------------
      - name: 构建镜像
        run: docker build -t report-portal-lab:ci .

      # ---------------------------------------------------------------
      # 4) 启动容器并等待就绪
      # ---------------------------------------------------------------
      - name: 启动容器
        run: |
          set -e
          docker run -d --name lab -p 127.0.0.1:18081:8080 report-portal-lab:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/ || true)
            if [ "$code" = "200" ]; then
              echo "服务已就绪（第 ${i} 次探测）"
              exit 0
            fi
            sleep 1
          done
          echo "::error::容器启动后 30 秒内未就绪"
          docker logs lab
          exit 1

      # ---------------------------------------------------------------
      # 5) 冒烟测试 —— 验证靶场的漏洞链完好，不只是"首页能打开"
      # ---------------------------------------------------------------
      - name: 冒烟测试
        run: |
          set -e
          B=http://127.0.0.1:18081

          status() { curl -s -o /dev/null -w '%{http_code}' "$1"; }
          size()   { curl -s -o /dev/null -w '%{size_download}' "$1"; }

          expect_status() { # $1=说明  $2=期望  $3=实际
            if [ "$2" = "$3" ]; then
              echo "  OK   $1 -> HTTP $3"
            else
              echo "::error::$1 期望 HTTP $2，实际 HTTP $3"
              exit 1
            fi
          }

          expect_bigger() { # $1=说明  $2=下限  $3=实际
            if [ "$3" -gt "$2" ]; then
              echo "  OK   $1 -> $3 字节"
            else
              echo "::error::$1 期望大于 $2 字节，实际 $3 字节"
              exit 1
            fi
          }

          echo "[1] 首页注释里的线索"
          curl -s "$B/" | grep -q "debug/env" || { echo "::error::首页注释里的线索缺失"; exit 1; }
          echo "  OK   首页注释含 /debug/env 线索"

          echo "[2] 未授权调试接口"
          expect_status "调试接口可匿名访问" 200 "$(status "$B/debug/env")"
          curl -s "$B/debug/env" | grep -q "report.db" || { echo "::error::调试接口未泄露数据文件位置"; exit 1; }
          echo "  OK   调试接口泄露数据文件位置"

          echo "[3] 正常预览（建立基线）"
          expect_status "正常预览" 200 "$(status "$B/report/preview?name=sales_summary.db")"
          expect_bigger "正常预览返回文件" 5000 "$(size "$B/report/preview?name=sales_summary.db")"

          echo "[4] 明文上跳必须被拦"
          expect_status "明文 ../ 被拦截" 400 "$(status "$B/report/preview?name=../data/report.db")"

          echo "[5] 双重编码绕过必须成立"
          expect_status "双重编码绕过" 200 "$(status "$B/report/preview?name=..%252fdata%252freport.db")"
          expect_bigger "绕过拿到数据文件" 20000 "$(size "$B/report/preview?name=..%252fdata%252freport.db")"

          echo "[6] 表达式帮助页"
          expect_status "表达式语法说明页" 200 "$(status "$B/help/expression")"

          echo "[7] 越界读取必须被拦"
          expect_status "越界读 /etc/passwd 被拦截" 403 "$(status "$B/report/preview?name=%252e%252e%252f%252e%252e%252f%252e%252e%252fetc%252fpasswd")"

          echo ""
          echo "全部冒烟测试通过 ✅"

      # ---------------------------------------------------------------
      # 6) 失败时把容器日志打出来，方便定位
      # ---------------------------------------------------------------
      - name: 失败时输出容器日志
        if: failure()
        run: docker logs lab || true

      # ---------------------------------------------------------------
      # 7) 无论成功失败都清理
      # ---------------------------------------------------------------
      - name: 清理
        if: always()
        run: docker rm -f lab || true
